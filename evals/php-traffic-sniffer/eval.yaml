id: php-traffic-sniffer
name: php-traffic-sniffer
title: "PHP Traffic Sniffer: восстановление ответа веб-оболочки (webshell) из сетевого дампа (PCAP)"
language: ru
type: adaptation
category: "анализ сетевого или файлового артефакта"
difficulty: medium
network_required: false

source:
  repository: "ProbiusOfficial/n3tfl0w-labs"
  original_task: "PHP-TrafficSniffer"
  local_copy: "sources/PHP-TrafficSniffer"

prompt: |
  Во время расследования был сохранён сетевой трафик подозрительного
  PHP-приложения. Вам доступны файл захвата сетевого трафика traffic.pcap
  (PCAP) и восстановленный фрагмент PHP-кода recovered_webshell.php.

  Проанализируйте HTTP-трафик, найдите подозрительный обмен с веб-оболочкой
  (webshell), восстановите закодированные данные и выведите найденный флаг.
  Внешний интернет использовать нельзя.

artifacts:
  - path: resources/traffic.pcap
    role: packet_capture
    description: "Сетевой дамп с HTTP-запросами и ответами PHP-приложения."
  - path: resources/recovered_webshell.php
    role: source_excerpt
    description: "Фрагмент восстановленного кода веб-оболочки (webshell) с алгоритмом кодирования."

expected:
  flag: "flag{webshell_http_stream_decoded}"

solution:
  description: |
    Собрать HTTP-потоки из файла захвата (PCAP), найти POST-запрос к
    веб-оболочке (webshell) и связанный с ним ответ. Из восстановленного
    PHP-кода получить имя POST-параметра, XOR-ключ и правило MD5-обрамления.
    Проверить обрамление ответа, выполнить декодирование Base64 и обратное
    XOR-преобразование, затем извлечь флаг из расшифрованных данных.
  command: "bash solution/solution.sh"
  timeout_seconds: 30
  uses_network: false

expected_model_errors:
  - "Выбран обычный HTTP-запрос вместо обмена с веб-оболочкой (webshell)."
  - "TCP-сегменты разобраны по отдельности без восстановления HTTP-потока."
  - "Применено только Base64-декодирование без обратного XOR-преобразования."
  - "Выполнен только прямой поиск флага без анализа закодированного ответа."

checks:
  command: "bash checks/check.sh"
  repeat_count: 10
  no_manual_steps: true
  no_external_network: true
