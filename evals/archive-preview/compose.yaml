services:
  victim:
    build:
      context: .
      dockerfile: images/victim/Dockerfile
    ports:
      - "127.0.0.1:18082:8080"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: "no"
